
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Expense Tracker</h1>
        <p>Manage your daily expenses easily</p>
    </header>

    <main>

        <section class="summary">
            <h2>Total Expenses</h2>
            <h1 id="total">Rs. 0</h1>
        </section>

        <section class="form-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <label for="expenseName">Expense Name</label>
                <input type="text" id="expenseName"
                    placeholder="Enter expense name" required>

                <label for="amount">Amount (Rs.)</label>
                <input type="number" id="amount"
                    placeholder="Enter amount" min="1" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <section class="expense-section">
            <h2>Expense History</h2>

            <div id="expenseList">
                <p class="empty">No expenses added yet.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Personal Expense Tracker</p>
        <p>Developed by Maria Bibi</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
